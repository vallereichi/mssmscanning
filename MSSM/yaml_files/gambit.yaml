Parameters:
  StandardModel_SLHA2:
    alphainv: 1.27950000E+02
    GF: 1.16637870E-05
    alphaS: 1.18100000E-01
    mZ: 9.11876000E+01
    mBmB: 4.18000000E+00
    mT: 1.73340000E+02
    mTau: 1.77686000E+00
    mNu3: 0
    mE: 5.10998946E-04
    mNu1: 0
    mMu: 1.05658375E-01
    mNu2: 0
    mD: 4.70000000E-03
    mU: 2.20000000E-03
    mS: 9.60000000E-02
    mCmC: 1.28000000E+00
    CKM_lambda: 0.22537
    CKM_A: 0.814
    CKM_rhobar: 0.117
    CKM_etabar: 0.353
    theta12: 0.58376
    theta23: 0.76958
    theta13: 0.15495
    delta13: 0
    alpha1: 0
    alpha2: 0
  MSSM7atQ:
    Qin:
      fixed_value: 1000.0
    SignMu: [-1.0, 1.0]
    Ad_3:
      prior_type: flat
      range: [-1e3, 1e3]
    Au_3:
      prior_type: flat
      range: [-1e3, 1e3]
    M2:
      prior_type: flat
      range: [-1e3, 1e3]
    TanBeta:
      prior_type: flat
      range: [3.0, 70.0]
    mHd2:
      prior_type: flat
      range: [-1000, 3e6]
    mHu2:
      prior_type: flat
      range: [-3e6, 1000]
    mf2:
      prior_type: flat
      range: [0, 1e5]
Priors: ~
Printer:
  printer: hdf5
  options:
    group: /MSSM
    output_file: MSSM7atQ.hdf5
    delete_file_on_restart: true
    default_output_path: runs/FS_MSSM7atQ//samples/
Scanner:
  use_scanner: random
  scanners:
    de:
      plugin: diver
      like: LogLike
      NP: 1000
      convthresh: 1e-3
      maxgen: 1000
      verbosity: 3
    random:
      plugin: random
      like: LogLike
      point_number: 3000
      verbosity: 3
  default_output_path: runs/FS_MSSM7atQ//scanner_plugins/
ObsLikes:
  - purpose: Observable
    capability: MSSM_spectrum
    type: map_str_dbl
  - purpose: Observable
    capability: muon_gm2
  - purpose: Observable
    capability: lnL_gm2
  - purpose: Observable
    capability: RD_oh2
  - purpose: Observable
    capability: lnL_oh2
Rules:
  - capability: unimproved_MSSM_spectrum
    type: Spectrum
    function: get_MSSMatQ_spectrum_FS
  - capability: MSSM_spectrum
    type: Spectrum
    function: make_MSSM_precision_spectrum_none
  - capability: muon_gm2
    function: GM2C_SUSY
  - capability: muon_gm2_SM
    function: gm2_SM_ee
  - capability: lnL_oh2
    function: lnL_oh2_upperlimit
  - capability: RD_oh2
    function: RD_oh2_MicrOmegas
  - capability: decay_rates
    type: DecayTable
    function: all_decays
    module: DecayBit
  - capability: Reference_SM_Higgs_decay_rates
    function: Ref_SM_Higgs_decays_table
  - capability: Reference_SM_other_Higgs_decay_rates
    function: Ref_SM_other_Higgs_decays_table
  - capability: Reference_SM_A0_decay_rates
    function: Ref_SM_A0_decays_table
  - capability: Higgs_decay_rates
    function: MSSM_h0_1_decays
  - capability: h0_2_decay_rates
    function: h0_2_decays
  - capability: A0_decay_rates
    function: A0_decays
  - capability: H_plus_decay_rates
    function: H_plus_decays
  - capability: t_decay_rates
    function: t_decays
  - capability: RD_eff_annrate
    function: RD_eff_annrate_from_ProcessCatalog
  - capability: TH_ProcessCatalog
